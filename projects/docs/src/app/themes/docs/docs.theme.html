<div class="overlay" [class.open]="leftOpen()" (click)="leftOpen.set(false)"></div>

<div class="left" [class.open]="leftOpen()" (click)="$event.stopPropagation()">
  <div class="left-btn" (click)="leftOpen.update(v => !v)">
    <i class="fa-solid" [ngClass]="leftBtn()"></i>
  </div>

  <div class="close-btn" (click)="leftOpen.set(false)">
    <i class="fa-solid fa-times"></i>
  </div>

  <h1 class="title">{{ name() }}</h1>

  <div class="search">
    <input type="text" [(ngModel)]="search" placeholder="Search Menu">

    @if (search()) {
      <div class="clear-btn" (click)="search.set('')">
        <i class="fa-solid fa-times"></i>
      </div>
    }
  </div>

  <doc-menu [data]="menuSearch()" />
</div>

<div class="main" [class.drawer]="leftOpen()">
  <div class="header">
    <h2 class="title">{{ title() }}</h2>

    <div class="right-btn" (click)="rightOpen.update(v => !v)">
      <i class="fa-solid" [ngClass]="rightBtn()"></i>
    </div>
  </div>

  <div class="body">
    <div class="content">
      <ng-content></ng-content>
    </div>

    <div class="right" [class.open]="rightOpen()">
      @let secs = sections();

      <span>Sections: {{ secs.length }}</span>

      @if (secs.length) {
        <ul class="submenu">
          @for (item of secs; track $index) {
            <li>
              <a href="">{{ item.name() }}</a>
            </li>
          }
        </ul>
      }
    </div>
  </div>

</div>
