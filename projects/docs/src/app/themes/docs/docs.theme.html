<div class="overlay" [class.open]="leftOpen()"></div>

<div class="left" [class.open]="leftOpen()" (click)="onLeftClick($event)">
  <div class="left-btn-pane">
    <div class="left-btn" (click)="$event.stopPropagation(); leftOpen.update(v => !v)">
      <i class="fa-solid" [ngClass]="leftBtn()"></i>
    </div>
  </div>

  <div class="sticky">
    <div class="close-btn" (click)="leftOpen.set(false)">
      <i class="fa-solid fa-times"></i>
    </div>

    <h1 class="title">{{ name() }}</h1>

    <div class="search">
      <input type="text" [(ngModel)]="search" placeholder="Search Menu">

      @if (search()) {
        <div class="clear-btn" (click)="search.set('')">
          <i class="fa-solid fa-times"></i>
        </div>
      }
    </div>

    <doc-menu [data]="menuSearch()" />
  </div>
</div>

<div class="main" [class.drawer]="leftOpen()">
  <div class="header">
    <h2 class="title">{{ title() }}</h2>

    <div class="right-btn" (click)="$event.stopPropagation(); rightOpen.update(v => !v)">
      <i class="fa-solid" [ngClass]="rightBtn()"></i>
    </div>
  </div>

  <div class="body">
    <div class="content">
      <ng-content></ng-content>
    </div>

    <div class="right" [class.open]="rightOpen()" (click)="onRightClick($event)">
      @let sectionList = sections();

      @if (sectionList.length) {
        <div class="wrapper">
          <h3>Contents</h3>
          <doc-submenu [data]="sectionList" />
        </div>
      }
    </div>
  </div>

</div>
