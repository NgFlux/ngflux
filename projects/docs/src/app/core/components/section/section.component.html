<div class="wrapper">
  @if (name()) {
    @if (parent) {
      <h3>{{ name() }} @if (subtitle()) { <small>{{ subtitle() }}</small> }</h3>
    } @else {
      <h2>{{ name() }} @if (subtitle()) { <small>{{ subtitle() }}</small> }</h2>
    }
  }

  <div class="content">
    <ng-content></ng-content>
  </div>
</div>
