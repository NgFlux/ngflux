<div class="wrapper">
  <div class="header">
    <!--  -->
  </div>

  @let entries = blocks();

  @if (entries.length) {
    <div class="tabs">
      @for (item of entries; track $index) {
        <div class="tabs-item" [class.active]="index() === $index" (click)="index.set($index)">
          <div class="name">{{ item.name() }}</div>
        </div>
      }
    </div>
  }

  <div class="body">
    <div class="content">
      <ng-content select="doc-code"></ng-content>
    </div>
  </div>
</div>
