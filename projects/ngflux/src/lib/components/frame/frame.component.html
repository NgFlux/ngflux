<div class="frame">
  <!-- BEGIN: Frame Header -->
  <div class="frame-header">
    @if (image()) {
      <img [src]="image()" alt="" class="image">
    } @else if (icon()) {
      <div class="icon">
        <i [className]="icon()"></i>
      </div>
    }

    @if (title()) {<h1>{{ title() }}</h1>}

    <ngf-frame-header-menu [menu]="headerMenu()" />
  </div>
  <!-- END: Frame Header -->

  <div class="frame-body">
    <!-- BEGIN: Left Sidebar -->
    <div #left class="frame-body-left" [class.drawer]="drawer()">
      <div class="btn-row">
        <div class="close-btn" (click)="closeDrawer($event)">
          <i class="ngf-icon close"></i>
        </div>
      </div>

      <div class="search-form">
        <input type="text" placeholder="Search menu" [(ngModel)]="search">

        @if (search()) {
          <div class="clear" (click)="search.set('')">
            <i class="ngf-icon close"></i>
          </div>
        }
      </div>

      <div class="menu-pane">
        <ngf-frame-side-menu [menu]="sideMenu()" />
      </div>
    </div>
    <!-- END: Left Sidebar -->

    <div class="frame-body-overlay" [class.drawer]="drawer()"></div>

    <!-- BEGIN: Right Sidebar -->
    <div class="frame-body-right" [class.drawer]="drawer()">
      <div class="frame-toolbar">
        <div class="drawer-btn" (click)="toggleDrawer($event)">
          <i class="ngf-icon menu"></i>
        </div>

        <div class="spacer"></div>

        <!--
          <div class="drawer-btn" (click)="toggleDrawer($event)">
            <i class="ngf-icon close"></i>
          </div>
        -->
      </div>

      <div class="frame-content">
        <ng-content></ng-content>
      </div>
    </div>
    <!-- END: Right Sidebar -->
  </div>
</div>
